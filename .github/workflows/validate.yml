name: Validate RIG Communications
on:
  push:
    paths:
      - 'src/**'
      - 'scores/**'
      - 'docs/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scoring engine tests
        run: |
          cd src
          python scoring.py
          python swarm.py
      - name: Validate JSON examples
        run: |
          python -m json.tool scores/examples.json > /dev/null
